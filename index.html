<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A responsive sign-in interface built with HTML and CSS."
    />
    <title>Sign in — UI Demo</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="page">
      <section class="login-card" aria-labelledby="page-title">
        <div class="brand-mark" aria-hidden="true">G</div>
        <p class="eyebrow">WELCOME BACK</p>
        <h1 id="page-title">Sign in</h1>
        <p class="intro">Enter your details to preview the sign-in interface.</p>

        <fieldset class="credentials">
          <legend class="visually-hidden">Sign-in details</legend>

          <div class="field">
            <label for="email">Email address</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="you@example.com"
              autocomplete="off"
              required
            />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Enter a sample password"
              autocomplete="off"
              required
            />
          </div>

          <button id="sign-in-button" type="button">Continue</button>
        </fieldset>

        <p class="demo-note">
          This is a front-end demo only. It does not authenticate, send, or save
          your details.
        </p>
        <p id="form-status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script>
      const email = document.querySelector("#email");
      const password = document.querySelector("#password");
      const status = document.querySelector("#form-status");

      document.querySelector("#sign-in-button").addEventListener("click", () => {
        if (!email.reportValidity() || !password.reportValidity()) {
          return;
        }

        status.textContent =
          "Preview only — no sign-in service is connected.";
      });
    </script>
  </body>
</html>
